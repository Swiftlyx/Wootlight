[package]
name = "wootlight"
version = "1.2.0"
edition = "2024"
description = "Music spectrum visualizer on the lighting of Wooting keyboards, living in the Windows tray or the macOS menu bar"
license = "MIT"
repository = "https://github.com/Swiftlyx/Wootlight"

[[bin]]
name = "Wootlight"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
libloading = "0.9.0"
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Performance", "Win32_System_Threading", "Win32_Graphics_Dxgi", "Win32_System_Com", "Media_Control", "Foundation_Collections", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Devices_FunctionDiscovery"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-graphics = "0.3.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
